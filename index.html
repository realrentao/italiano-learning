<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意大利语互动学习 · Impara l'italiano giocando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #f5f4f0 0%, #e8e6e1 100%);
      min-height: 100vh;
      color: #2c2c2c;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 20px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #c0392b, #a33025);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      box-shadow: 0 8px 30px rgba(192, 57, 43, 0.3);
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #27ae60, #219a52);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 36px;
      font-weight: 700;
      color: #2c2c2c;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #888;
      font-weight: 400;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: #c0392b;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .card-text h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 600;
      color: #2c2c2c;
      margin-bottom: 4px;
    }

    .card-text p {
      font-size: 13px;
      color: #999;
    }

    .card-arrow {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f5f4f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .card:hover .card-arrow {
      background: #c0392b;
      color: white;
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #e5e5e5;
    }

    .footer a {
      color: #c0392b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer p {
      font-size: 12px;
      color: #bbb;
      margin-top: 10px;
    }

    .coming-soon {
      margin-top: 40px;
      text-align: center;
    }

    .coming-soon-label {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 20px;
    }

    .coming-soon-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .coming-soon-card {
      background: white;
      border-radius: 12px;
      padding: 20px 16px;
      opacity: 0.6;
    }

    .coming-soon-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .coming-soon-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: #2c2c2c;
      margin-bottom: 4px;
    }

    .coming-soon-card p {
      font-size: 11px;
      color: #bbb;
    }

    @media (max-width: 600px) {
      .container { padding: 40px 16px 40px; }
      h1 { font-size: 28px; }
      .card { padding: 20px; }
      .card-icon { width: 48px; height: 48px; font-size: 24px; border-radius: 12px; }
      .card-text h2 { font-size: 16px; }
      .coming-soon-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🇮🇹</div>
      <div class="badge">互动学习</div>
      <h1>意大利语学习</h1>
      <p class="subtitle">Impara l'italiano giocando</p>
    </div>

    <!-- 意大利语谚语 -->
    <div class="section">
      <div class="section-label">MODULO 01</div>
      <div class="card" onclick="location.href='proverbi.html'">
        <div class="card-icon" style="background: linear-gradient(135deg, #c0392b, #a33025);">
          📜
        </div>
        <div class="card-text">
          <h2>意大利语谚语</h2>
          <p>Proverbi italiani · 经典俗语</p>
        </div>
        <div class="card-arrow">→</div>
      </div>
    </div>

    <!-- 意大利语常用语 -->
    <div class="section">
      <div class="section-label">MODULO 02</div>
      <div class="card" onclick="location.href='comuni.html'">
        <div class="card-icon" style="background: linear-gradient(135deg, #d4a017, #b8860b);">
          💬
        </div>
        <div class="card-text">
          <h2>意大利语常用语</h2>
          <p>Frasi comuni · 日常高频表达</p>
        </div>
        <div class="card-arrow">→</div>
      </div>
    </div>

    <!-- 意大利语情景对话 -->
    <div class="section">
      <div class="section-label">MODULO 03</div>
      <div class="card" onclick="location.href='dialoghi.html'">
        <div class="card-icon" style="background: linear-gradient(135deg, #e67e22, #d35400);">
          🗣️
        </div>
        <div class="card-text">
          <h2>意大利语情景对话</h2>
          <p>Dialoghi quotidiani · 日常生活实用对话</p>
        </div>
        <div class="card-arrow">→</div>
      </div>
    </div>

    <!-- Coming Soon -->
    <div class="coming-soon">
      <div class="coming-soon-label">更多内容 敬请期待</div>
      <div class="coming-soon-grid">
        <div class="coming-soon-card">
          <div class="coming-soon-icon">📝</div>
          <h3>意大利语语法速查</h3>
          <p>Grammatica essentials</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com/realrentao/italiano-learning" target="_blank">GitHub · 源码仓库</a>
      <p>抖音博主 @涛子办事处</p>
    </div>
  </div>
</body>
</html>
